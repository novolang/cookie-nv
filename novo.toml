[package]
name        = "cookie-nv"
version     = "0.1.0"
description = "RFC 6265bis in both directions: a `Cookie` header parsed into name and value spans over the caller's own string, a `Set-Cookie` parsed strictly or as a browser reads it, written with the `__Host-` and `__Secure-` prefix rules refused rather than warned about, a cookie jar with the storage model's domain, path, expiry and ordering rules over a time the caller passes in, and signed and encrypted cookies with the cipher supplied by the caller."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`.  A cookie header is a string the caller already holds, an
# attribute set is a value, and a jar is arithmetic over both.  The
# clock and the cipher are arguments: `Expires` is calendar-nv's civil
# date-time, which the caller reads off its own clock, and encryption is
# a pair of functions the caller supplies.
#
# No build for a microcontroller: a jar is a growable list and a header
# is a string.
layer       = "core"

category    = "web"

tags        = ["cookie", "set-cookie", "rfc6265", "http", "session", "samesite", "signed-cookies", "sans-io"]
repository  = "https://github.com/novolang/cookie-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.14.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "The attributes a browser silently ignores, refused where they are written"

[dependencies]
# calendar-nv, for `Expires`.  A cookie's expiry is a civil date-time in
# UTC, and a jar compares it with a time the caller passes in.  RFC
# 6265bis section 5.1.1's date parser stays in this package, because it
# reads spellings calendar-nv's parsers correctly refuse.
calendar-nv = "^0.2.0"

# crypto-nv, for `hashing.hmac_sha256`, the MAC under a signed cookie
# and the key derivation.
crypto-nv = "^0.1.6"
